<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Candidate Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h2>Add New Candidate</h2>
        <form th:action="@{/candidates}" th:object="${candidate}" method="post">
            
            <div class="form-group">
                <label>Full Name:</label>
                <input type="text" th:field="*{fullName}" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" th:field="*{email}" required>
            </div>
            <div class="form-group">
                <label>Phone:</label>
                <input type="text" th:field="*{phone}">
            </div>
            <div class="form-group">
                <label>Job Position:</label>
                <select th:field="*{job.id}">
                    <option th:each="job : ${jobs}" th:value="${job.id}" th:text="${job.title}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>Resume Link (URL):</label>
                <input type="text" th:field="*{resumeUrl}">
            </div>
            
            <button type="submit" class="btn btn-primary">Submit Application</button>
        </form>
    </div>
</body>
</html>
