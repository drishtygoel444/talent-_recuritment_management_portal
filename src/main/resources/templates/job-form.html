<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Job Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h2 th:text="${job.id == null ? 'Create Job Posting' : 'Edit Job Posting'}"></h2>
        <form th:action="@{/jobs}" th:object="${job}" method="post">
            <input type="hidden" th:field="*{id}">
            
            <div class="form-group">
                <label>Job Title:</label>
                <input type="text" th:field="*{title}" required>
            </div>
            <div class="form-group">
                <label>Department:</label>
                <input type="text" th:field="*{department}" required>
            </div>
            <div class="form-group">
                <label>Location:</label>
                <input type="text" th:field="*{location}">
            </div>
            <div class="form-group">
                <label>Job Type:</label>
                <select th:field="*{jobType}">
                    <option value="Full-Time">Full-Time</option>
                    <option value="Part-Time">Part-Time</option>
                    <option value="Contract">Contract</option>
                    <option value="Remote">Remote</option>
                </select>
            </div>
            <div class="form-group">
                <label>Description:</label>
                <textarea th:field="*{description}" rows="5"></textarea>
            </div>
            
            <button type="submit" class="btn btn-primary">Save Job</button>
        </form>
    </div>
</body>
</html>
