<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Job Postings</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav>
        <h1>Talent Recruitment Portal</h1>
        <ul>
            <li><a th:href="@{/jobs}">Jobs</a></li>
            <li><a th:href="@{/candidates}">Candidates</a></li>
        </ul>
    </nav>
    <div class="container">
        <h2>Job Openings</h2>
        <a th:href="@{/jobs/new}" class="btn btn-primary" style="margin-bottom: 1rem;">Add New Job</a>
        
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Department</th>
                    <th>Location</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="job : ${jobs}">
                    <td th:text="${job.id}">1</td>
                    <td th:text="${job.title}">Software Engineer</td>
                    <td th:text="${job.department}">Engineering</td>
                    <td th:text="${job.location}">Remote</td>
                    <td th:text="${job.jobType}">Full-time</td>
                    <td th:text="${job.active ? 'Active' : 'Closed'}">Active</td>
                    <td>
                        <a th:href="@{/jobs/edit/{id}(id=${job.id})}" class="btn btn-primary">Edit</a>
                        <a th:href="@{/jobs/delete/{id}(id=${job.id})}" class="btn btn-danger">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
